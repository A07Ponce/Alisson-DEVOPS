name: CI/CD - alisson-johanna-ponce-suntaxi

on:
  push:
    branches:
      - alisson-johanna-ponce-suntaxi

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Fly Registry
        uses: docker/login-action@v2
        with:
          registry: registry.fly.io
          username: ${{ secrets.FLY_API_TOKEN }}
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: registry.fly.io/${{ secrets.FLY_APP_NAME }}:alisson-johanna-ponce-suntaxi-1.0.0
          file: ./Dockerfile
          platforms: linux/amd64

      - name: Install flyctl
        uses: superfly/flyctl-actions@v1
        with:
          version: latest

      - name: Deploy to Fly (using image)
        run: |
          flyctl deploy --app "${{ secrets.FLY_APP_NAME }}" --image "registry.fly.io/${{ secrets.FLY_APP_NAME }}:alisson-johanna-ponce-suntaxi-1.0.0" --region ord
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
